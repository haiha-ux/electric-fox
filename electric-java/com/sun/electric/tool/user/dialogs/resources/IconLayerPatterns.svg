<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <defs>
    <pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#505050" stroke-width="0.8"/>
    </pattern>
    <pattern id="dots" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.6" fill="#505050"/>
    </pattern>
  </defs>
  <rect x="2" y="2" width="10" height="4" rx="0.5" fill="url(#stripes)" stroke="#505050" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="4" y="6" width="10" height="4" rx="0.5" fill="url(#dots)" stroke="#505050" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="2" y="10" width="10" height="4" rx="0.5" fill="none" stroke="#505050" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
