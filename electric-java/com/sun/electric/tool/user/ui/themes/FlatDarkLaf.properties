#
# Electric VLSI - Claude-Inspired Dark Theme
# Warm dark brown/charcoal palette
#

# ---- Base Colors ----
@background = #1E1A16
@foreground = #E8E0D4
@disabledBackground = #2A2520
@disabledForeground = #7A7068

# ---- Accent Colors ----
@accentColor = #D4944A
@accentFocusColor = #E0A85E
@accentHoverColor = #C47B2B
@accentPressedColor = #B06A1A

# ---- Selection ----
@selectionBackground = #3D3228
@selectionForeground = #E8E0D4
@selectionInactiveBackground = #332C24
@selectionInactiveForeground = #C8C0B4

# ---- Component Backgrounds ----
@componentBackground = #252018
@menuBackground = #2A2520
@toolBarBackground = #242018
@statusBarBackground = #1A1612

# ---- Borders ----
@borderColor = #3D3228
@disabledBorderColor = #332C24
@focusedBorderColor = #D4944A
@cellFocusColor = #D4944A

# ---- Buttons ----
@buttonBackground = #332C24
@buttonHoverBackground = #3D3228
@buttonPressedBackground = #4A3F34

# ---- Scrollbar ----
@scrollBarThumbColor = #4A3F34
@scrollBarTrackColor = #252018

# ---- Menu ----
@menuHoverBackground = #3D3228
@menuCheckBackground = #4A3F34
@menuAcceleratorForeground = #7A7068

# ---- Input Fields ----
@textComponentBackground = #252018
@textSelectionBackground = #3D3228

# ---- Tabs ----
@tabSelectedBackground = #2A2520
@tabHoverBackground = #332C24
@tabUnderlineColor = #D4944A

# ---- Tree / List ----
@treeSelectionBackground = #3D3228

# ---- Tooltip ----
@tooltipBackground = #332C24
@tooltipForeground = #E8E0D4
@tooltipBorderColor = #4A3F34

# ---- Separator ----
@separatorColor = #3D3228

# ---- Window Title ----
@windowTitleBackground = #1A1612

# ---- Icons ----
@iconAccentColor = #D4944A

# ---- Error/Warning/Info ----
@errorColor = #E74C3C
@warningColor = #F39C12
@infoColor = #3498DB
@successColor = #2ECC71

# ---- Progress Bar ----
ProgressBar.background = #3D3228
ProgressBar.foreground = #D4944A
ProgressBar.selectionBackground = #E8E0D4
ProgressBar.selectionForeground = #1E1A16

# ---- Specific Component Overrides ----

RootPane.background = @background

# Menu Bar
MenuBar.background = @menuBackground
MenuBar.borderColor = @borderColor
MenuBar.hoverBackground = @menuHoverBackground
MenuBar.underlineSelectionHeight = 3
MenuBar.underlineSelectionColor = @accentColor

# Tool Bar
ToolBar.background = @toolBarBackground
ToolBar.borderColor = @borderColor
ToolBar.hoverButtonGroupBackground = #3D3228

# Toolbar buttons (rounded hover)
Button.toolbar.hoverBackground = #3D3228
Button.toolbar.pressedBackground = #4A3F34
ToggleButton.toolbar.hoverBackground = #3D3228
ToggleButton.toolbar.pressedBackground = #4A3F34
ToggleButton.toolbar.selectedBackground = @selectionBackground

# Popup Menu
PopupMenu.background = @menuBackground
PopupMenu.borderColor = @borderColor

# Menu Item
MenuItem.background = @menuBackground
MenuItem.selectionBackground = @menuHoverBackground
MenuItem.selectionForeground = @foreground
MenuItem.acceleratorForeground = @menuAcceleratorForeground

# Check Box Menu Item
CheckBoxMenuItem.background = @menuBackground
CheckBoxMenuItem.selectionBackground = @menuHoverBackground

# Split Pane
SplitPane.background = @background
SplitPaneDivider.draggingColor = @accentColor

# Table
Table.background = @componentBackground
Table.selectionBackground = @selectionBackground
Table.selectionForeground = @selectionForeground
Table.gridColor = #332C24
Table.cellMargin = 4,6,4,6
TableHeader.background = @toolBarBackground
TableHeader.hoverBackground = #3D3228
TableHeader.pressedBackground = #4A3F34

# Scroll Pane
ScrollPane.background = @background
ScrollBar.thumb = @scrollBarThumbColor
ScrollBar.track = @scrollBarTrackColor
ScrollBar.hoverThumbColor = #5A4F44
ScrollBar.pressedThumbColor = #6A5F54

# Tabbed Pane
TabbedPane.background = @background
TabbedPane.selectedBackground = @tabSelectedBackground
TabbedPane.hoverColor = @tabHoverBackground
TabbedPane.underlineColor = @tabUnderlineColor
TabbedPane.focusColor = @accentFocusColor
TabbedPane.contentAreaColor = @borderColor

# Text Field / Text Area
TextField.background = @textComponentBackground
TextField.selectionBackground = @textSelectionBackground
TextField.placeholderForeground = #5A5048
TextArea.background = @textComponentBackground
TextArea.selectionBackground = @textSelectionBackground
EditorPane.background = @textComponentBackground

# Tree
Tree.background = @componentBackground
Tree.selectionBackground = @treeSelectionBackground
Tree.selectionForeground = @foreground
Tree.hash = @borderColor
Tree.icon.expandedColor = @accentColor
Tree.icon.collapsedColor = #7A7068
Tree.icon.leafColor = #7A7068
Tree.icon.closedColor = @accentColor
Tree.icon.openColor = @accentColor

# List
List.background = @componentBackground
List.selectionBackground = @selectionBackground
List.selectionForeground = @selectionForeground

# Button
Button.background = @buttonBackground
Button.hoverBackground = @buttonHoverBackground
Button.pressedBackground = @buttonPressedBackground
Button.focusedBackground = #3D3228
Button.default.background = @accentColor
Button.default.foreground = #FFFFFF
Button.default.hoverBackground = @accentFocusColor
Button.default.pressedBackground = @accentHoverColor
Button.default.focusedBackground = @accentFocusColor

# Toggle Button
ToggleButton.background = @buttonBackground
ToggleButton.selectedBackground = @selectionBackground
ToggleButton.tab.underlineColor = @accentColor
ToggleButton.tab.selectedBackground = @tabSelectedBackground
ToggleButton.tab.hoverBackground = @tabHoverBackground

# Combo Box
ComboBox.background = @componentBackground
ComboBox.selectionBackground = @selectionBackground
ComboBox.buttonBackground = @buttonBackground

# Spinner
Spinner.background = @componentBackground
Spinner.buttonBackground = @buttonBackground

# Slider
Slider.trackColor = @borderColor
Slider.thumbColor = @accentColor
Slider.focusedColor = @accentFocusColor
Slider.hoverThumbColor = @accentHoverColor
Slider.pressedThumbColor = @accentPressedColor
Slider.trackValueColor = @accentColor
Slider.thumbSize = 16,16

# CheckBox / Radio
CheckBox.icon.checkmarkColor = #FFFFFF
CheckBox.icon.background = @componentBackground
CheckBox.icon.selectedBackground = @accentColor
CheckBox.icon.hoverBackground = #3D3228
CheckBox.icon.selectedFocusedBackground = @accentFocusColor
RadioButton.icon.centerDiameter = 8

# Internal Frame
InternalFrame.activeTitleBackground = @accentColor
InternalFrame.activeTitleForeground = #FFFFFF
InternalFrame.inactiveTitleBackground = @toolBarBackground
InternalFrame.inactiveTitleForeground = @disabledForeground

# Option Pane / Panel
OptionPane.background = @background
Panel.background = @background
Desktop.background = #141210

