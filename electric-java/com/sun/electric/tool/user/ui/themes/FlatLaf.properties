#
# Electric VLSI - Shared FlatLaf properties (applied to both light and dark themes)
# Modern UI: rounded corners, pill shapes, smooth hover effects
#

# ---- Rounded corners (generous arcs for modern look) ----
Button.arc = 12
Component.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 999
ComboBox.arc = 10
Spinner.arc = 10

# ---- Focus ----
Component.focusWidth = 1
Component.innerFocusWidth = 1
Component.borderWidth = 1

# ---- Scrollbar (pill-shaped, thin) ----
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.thumbArc = 999
ScrollBar.width = 10
ScrollBar.showButtons = false
ScrollBar.trackInsets = 3,3,3,3
ScrollBar.trackArc = 999

# ---- Tabs (modern underline style) ----
TabbedPane.tabHeight = 36
TabbedPane.showTabSeparators = false
TabbedPane.tabSelectionHeight = 3
TabbedPane.tabArc = 8
TabbedPane.tabInsets = 4,12,4,12
TabbedPane.tabSelectionArc = 8
TabbedPane.cardTabSelectionHeight = 3
TabbedPane.tabWidthMode = preferred

# ---- Menu ----
MenuItem.selectionType = underline
PopupMenu.arc = 8
MenuItem.margin = 4,12,4,12

# ---- Arrow style ----
Component.arrowType = chevron

# ---- No icons in menus by default (cleaner look) ----
MenuItem.minimumIconSize = 0,0

# ---- Buttons ----
Button.minimumWidth = 72
Button.default.boldText = true

# ---- Toolbar (rounded hover, no border) ----
Button.toolbar.arc = 10
Button.toolbar.margin = 4,6,4,6
ToggleButton.toolbar.arc = 10

# ---- Tree (rounded selection, wide) ----
Tree.wideSelection = true
Tree.selectionInsets = 0,4,0,4
Tree.selectionArc = 8
Tree.showDefaultIcons = true
Tree.rendererMargins = 2,0,2,4

# ---- List (rounded selection) ----
List.selectionInsets = 0,4,0,4
List.selectionArc = 8

# ---- Table ----
TableHeader.separatorColor = $Separator.foreground
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1

# ---- Split pane ----
SplitPane.dividerSize = 6
SplitPaneDivider.style = plain

# ---- Tooltip (rounded) ----
ToolTip.arc = 8

# ---- Title bar ----
TitlePane.unifiedBackground = true

# ---- Popup/Dialog ----
RootPane.borderDragThickness = 5

# ---- Component minimum height ----
Component.minimumHeight = 28
